<div style="width: 100%;float:left;background: url(white.png);    margin-bottom: 60px;">

    <div id="center_section" class="container">
        <div class="row">
            <div class="col-md-12 aro-data">
                <h4>ARO</h4>

                <p></p>
                <div class="data_row aln_ls">
                    <div class="col-md-12">
                        <div class="row">
                            <input type="text" name="" (input)="search($event)" placeholder="Search..">
                        </div>
                    </div>
                </div>

                <!-- <div class="example-table-container"> -->
                <table mat-table [dataSource]="dataSource" (matSortChange)="sortData($event)" matSort>
                    <ng-container matColumnDef="number">
                        <th mat-header-cell *matHeaderCellDef>S.No.</th>
                        <td mat-cell *matCellDef="let element;let i = index;">
                            {{i +1 + (myPaginator.pageIndex * myPaginator.pageSize)}}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> ARO Number </th>
                        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                    </ng-container>

                    <ng-container matColumnDef="document">
                        <th mat-header-cell *matHeaderCellDef> Document </th>
                        <td class="act-btn" mat-cell *matCellDef="let element">
                            <a href="javascript:void(0)" (click)="openDoc(element)">
                                <mat-icon>description</mat-icon>
                            </a>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="date">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
                        <td mat-cell *matCellDef="let element">{{element.createdAt | date:'dd MMM yyyy, HH:mm' }}</td>
                    </ng-container>



                    <tr mat-header-row *matHeaderRowDef="displayedColumns sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" style="text-align: center;" colspan="10">No Record Found</td>
                    </tr>
                </table>
              
                <div *ngIf="(aroRecords.length==0)" class="p-3" style="text-align: center;">
                    <h5>
                    Record not found
                </h5>
                </div>



                <div class="">
                    <mat-paginator #myPaginator [pageSizeOptions]="[10,20,50,100]" showFirstLastButtons></mat-paginator>

                </div>
            </div>
        </div>
    </div>
</div>
