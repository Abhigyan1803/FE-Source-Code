
<div style="width: 100%;float:left;background: url(white.png);    margin-bottom: 60px;">
   
    
    <div style="margin-top: 30px;" class="container">
       
            <h4>E-Book List </h4>
                <p></p>
            
        
     
            <div class="example-container ">
                <div class="example-table-container">
                <mat-card style="margin: 0px !important;">
                
                    <table mat-table [dataSource]="dataSource" matSort matTableExporter  >

                      <ng-container matColumnDef="number">
                        <th mat-header-cell *matHeaderCellDef>S.No.</th>
                        <td mat-cell *matCellDef="let element;let i = index;">
                            {{i +1 }} </td>
                    </ng-container>
                        <ng-container matColumnDef="name">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                          <td mat-cell *matCellDef="let element">{{element.name}}</td>
                        </ng-container>
  
                        <ng-container matColumnDef="desc">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
                          <td mat-cell *matCellDef="let element">{{element.description}}</td>
                        </ng-container>
                        <ng-container matColumnDef="visit">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Visit URL</th>
                            <td mat-cell *matCellDef="let a"> 
                                <a href="javascript:void(0)" (click)="visitURL(a)" >
                                    <mat-icon>
                                        open_in_new
                                    </mat-icon>
                                </a>
                            </td>
                        </ng-container>

                       
  
                        
                        <tr class="mat-row" >
                          <td class="mat-cell text-center" >
                            No data found.
                          </td>
                        </tr>
  
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                      </table>
                    </mat-card>
                </div>
        
            </div>
       
    </div>
       
    </div>
