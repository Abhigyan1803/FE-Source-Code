<div style="width: 100%;float:left;background: url(white.png);    margin-bottom: 60px;">
   
    
<div style="margin-top: 30px;" class="container">
   
        <h4>Commandant Recommended Reading List </h4>
            <p></p>
        
    
 
        <div class="example-container ">
            <div class="example-table-container">
            <mat-card style="margin: 0px !important;">
                <div class="data_row aln_ls">
                    <div class="col-md-12">
                        <div class="row">
                            <input type="text" name="" (input)="applyFilter($event)" placeholder="Search..">
                        </div>
                    </div>
                </div>
                <table mat-table [dataSource]="dataSource" (matSortChange)="sortData($event)" matSort>
    
                    <!-- Position Column -->
                    <ng-container matColumnDef="number">
                        <th mat-header-cell *matHeaderCellDef>S.No.</th>
                        <td mat-cell *matCellDef="let element;let i = index;">
                            {{i +1 + (myPaginator.pageIndex * myPaginator.pageSize)}} </td>
                    </ng-container>
    
                    <!-- Rank Column -->
                    <ng-container matColumnDef="bookName">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Book Name </th>
                        <td mat-cell *matCellDef="let element"> {{element.bookName}} </td>
                    </ng-container>
    
                    <!-- Name Column -->
                    <ng-container matColumnDef="bookGenre">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Book Genre </th>
                        <td mat-cell *matCellDef="let element"> {{element.bookGenre}} </td>
                    </ng-container>
    
                    <!-- Email Column -->
                    <ng-container matColumnDef="description">
                        <th mat-header-cell *matHeaderCellDef>Description</th>
                        <td mat-cell *matCellDef="let element"> {{element.description}} </td>
                    </ng-container>
    
                    <ng-container matColumnDef="authorName" >
                        <th mat-header-cell *matHeaderCellDef  mat-sort-header>Author </th>
                        <td mat-cell *matCellDef="let element">{{element.authorName}}</td>
                    </ng-container>
    
                  
                   
    
              
    
                    <tr mat-header-row *matHeaderRowDef="displayedColumns sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" style="text-align: center;" colspan="10">No Record Found</td>
                    </tr>
                </table>
                </mat-card>
            </div>
    
            <mat-paginator #myPaginator [pageSizeOptions]="[10,20,50,100]" showFirstLastButtons></mat-paginator>
        </div>
   
</div>
   
</div>
