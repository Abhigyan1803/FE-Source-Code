<div class="main-content">
    <div class="container-fluid">
      <div class="mat-heading">
        <div id="top-bar" class="">
          <h2 class="backbtn"><button mat-icon-button (click)="goBack()">
            <mat-icon>chevron_left</mat-icon>
          </button>E-Dossier <span class="sub-menu1">
            > LVE</span></h2>
      </div>
      </div>
      <div class="mat-card mat-focus-indicator">
        <div class="service-id mb-2">
            
            <form class="ng-untouched ng-pristine ng-invalid">
              <div class="row">
                <div class="col-md-2">
                  <div class="form-group">
                    <label for="rank">IMA No.</label>
                    <input placeholder="No"  type="text" disabled id="lveServiceID" class="form-control ng-untouched ng-pristine ng-invalid">
                  </div>
                </div>  
                <div class="col-md-2">
                  <div class="form-group">
                    <label for="rank">Rank</label>
                    <input placeholder="Rank"  type="text" disabled id="lverk" class="form-control ng-untouched ng-pristine ng-invalid">
                  </div>
                </div>
                <div class="col-md-2">
                  <div class="form-group">
                    <label for="rank">Name</label>
                    <input placeholder="Name"  type="text" disabled id="lveName" class="form-control ng-untouched ng-pristine ng-invalid">
                  </div>
                </div>
                <div class="col-md-2">
                  <div class="form-group">
                    <label for="rank">Term</label>
                    <input placeholder="Term"  type="text" disabled id="lvetName" class="form-control ng-untouched ng-pristine ng-invalid">
                  </div>
                </div>
                <div class="col-md-2">
                  <div class="form-group">
                    <label for="rank">Bn</label>
                    <input placeholder="Bn"  type="text" disabled id="lveBn" class="form-control ng-untouched ng-pristine ng-invalid">
                  </div>
                </div>
                <div class="col-md-2">
                  <div class="form-group">
                    <label for="rank">Coy</label>
                    <input placeholder="Coy"  type="text" disabled id="lveComp" class="form-control ng-untouched ng-pristine ng-invalid">
                  </div>
                </div>
                
              </div>
            </form>
        </div>
  
    <div class="club">
        <div class="mat-card mat-focus-indicator">
            <div class="ng-star-inserted">
                <div class="mat-new mb-3">
                    <h4 class="card-heading">LVE DETAILS</h4>
                </div>
            </div>
                <table class="tg">
                <thead>
                  <tr>
                    <th class="tg-0lax" rowspan="2">TERM</th>
                    <th class="tg-baqh" colspan="2">LVE</th>
                    <th class="tg-0lax" rowspan="2">REASON</th>
                    <th class="tg-0lax" rowspan="2">ADDRESS</th>
                    <th class="tg-0lax" rowspan="2">SUBMISSION</th>
                  </tr>
                  <tr>
                    <th class="tg-0lax">FROM</th>
                    <th class="tg-0lax">TO</th>
                  </tr>
                </thead>
                <tbody>
                  <tr [formGroup]="lveDetailsFormI" [ngClass]="termId != 1 ? 'hide' : ''">
                    <td class="tg-0lax">I TERM</td>
                    <td class="tg-0lax"><input type="date" min="{{minDate}}" class="form-control" formControlName="lveFrom"></td>
                    <td class="tg-0lax"><input type="date" min="{{minDate}}" class="form-control" formControlName="lveTo"></td>
                    <td class="tg-0lax"><textarea type="text" class="form-control" maxlength="1500"
                      formControlName="reason"></textarea></td>
                    <td class="tg-0lax"><textarea type="text" class="form-control" maxlength="1500"
                      formControlName="address"></textarea></td>
                    <td class="tg-0lax"><button class="btn btn-color" (click)="addLvesubmit1()">Submit</button></td>
                  </tr>
                  <tr [formGroup]="lveDetailsFormII" [ngClass]="(termId != 2 && termId != 7) ? 'hide' : ''">
                    <td class="tg-0lax">II TERM/ II TECH</td>
                    <td class="tg-0lax"><input type="date" min="{{minDate}}" class="form-control" formControlName="lveFrom"></td>
                    <td class="tg-0lax"><input type="date" min="{{minDate}}" class="form-control" formControlName="lveTo"></td>
                    <td class="tg-0lax"><textarea type="text" class="form-control"  maxlength="1500"
                      formControlName="reason"></textarea></td>
                    <td class="tg-0lax"><textarea type="text" class="form-control"  maxlength="1500"
                      formControlName="address"></textarea></td>
                    <td class="tg-0lax"><button class="btn btn-color" (click)="addLvesubmit2()">Submit</button></td>
                  </tr>
                  <tr [formGroup]="lveDetailsFormIII" [ngClass]="(termId != 3 && termId != 8)? 'hide' : ''">
                    <td class="tg-0lax">III TERM/ III TECH</td>
                    <td class="tg-0lax"><input type="date" min="{{minDate}}" class="form-control" formControlName="lveFrom"></td>
                    <td class="tg-0lax"><input type="date" min="{{minDate}}" class="form-control" formControlName="lveTo"></td>
                    <td class="tg-0lax"><textarea type="text" class="form-control"  maxlength="1500"
                      formControlName="reason"></textarea></td>
                    <td class="tg-0lax"><textarea type="text" class="form-control"  maxlength="1500"
                      formControlName="address"></textarea></td>
                    <td class="tg-0lax"><button class="btn btn-color" (click)="addLvesubmit3()">Submit</button></td>
                  </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>	

</div>
