<div class="mat-new">
    <h4 class="card-heading"> TRG Battalion <span class="sub-menu1"> > BRO </span> </h4>

</div>

<mat-card>

    <div class="d-flex btn-set">
        <div class="col-md-3" >
            <select name="" id="" class="form-control" (change)="bnSelected($event)" >
                <option value="All">All Battalions</option>
                <option *ngFor="let bn of battalionsList"  [value]="bn.id">{{bn.shortName}} Bn</option>
            </select>
        </div>
        <div class="search">
            <input class="search_input" (input)="applyFilter($event)" placeholder="Search by BRO NO. ..." #input>
        </div>
    </div>

    <div class="example-container ">
        <div class="example-table-container">
            <table mat-table [dataSource]="dataSource" (matSortChange)="sortData($event)" matSort>

                <!-- Position Column -->
                <ng-container matColumnDef="number">
                    <th mat-header-cell *matHeaderCellDef>S.No.</th>
                    <td mat-cell *matCellDef="let element;let i = index;">
                        {{i +1 + (myPaginator.pageIndex * myPaginator.pageSize)}} </td>
                </ng-container>

                <!-- Date Column -->
                <ng-container matColumnDef="date">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
                    <td mat-cell *matCellDef="let element"> {{element.date|date:'d MMMM, y'}} </td>
                </ng-container>

                <ng-container matColumnDef="broNumber">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> BRO Number </th>
                    <td mat-cell *matCellDef="let element"> {{element.broNumber}} </td>
                </ng-container>

                <!-- Battalion -->
                <ng-container matColumnDef="battalion" >
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Battalion </th>
                    <td mat-cell *matCellDef="let element"> {{element?.battalian?.shortName || '-'}} Bn </td>
                </ng-container>

                <!-- Document Column -->
                <ng-container matColumnDef="document">
                    <th mat-header-cell *matHeaderCellDef> Document </th>
                    <td class="act-btn" mat-cell *matCellDef="let element">
                        <a class="act-btn" href="javascript:void(0)" (click)="openDoc(element.broDocuments)">
                            <mat-icon>description</mat-icon>
                        </a>
                    </td>
                </ng-container>

              
                <tr mat-header-row *matHeaderRowDef="displayedColumns sticky:true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                <!-- Row shown when there is no matching data. -->
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" style="text-align: center;" colspan="10">No Record Found</td>
                </tr>
            </table>

        </div>
        <mat-paginator #myPaginator [pageSizeOptions]="[10,20,50,100]" showFirstLastButtons></mat-paginator>
    </div>


</mat-card>
