<div class="mat-new">
    <h4 class="card-heading">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>chevron_left</mat-icon>
        </button><span class="sub-menu1"> Drill Subject > {{pTitle}} </span> <span class="sub-menu1">
           </span>
    </h4>
</div>
<mat-card>
    <div class="top-br">
        <form [formGroup]="addDrillForm">

            <div class="row">

                <div class="form-group col-md-6">
                   <label for="position">SubjectName<span class="required">*</span></label>
                   <input id="name" type="text" class="form-control" maxlength="100" formControlName="subjectName"
                   placeholder="SubjectName">
                    <span class="validation_msg"
                        *ngIf="f.subjectName.errors && f.subjectName.errors.required && isError">Please Enter SubjectName</span>
                </div>
              
              <div class="form-group col-md-6">
                <label class="form-label">Term </label>
                <select placeholder="" class="form-control" formControlName="termId">
                    <option disabled selected hidden></option>
                    <option *ngFor="let t of terms" [value]="t.id">{{t.name}} </option>
                </select>
                <span class="validation_msg"
                *ngIf="f.termId.errors && f.termId.errors.required && isError">Please Enter termId</span>
            </div>

            </div>
          
              <div class="row">
                <div class="form-group col-md-6">
                  <label for="position">TotalMark<span class="required">*</span></label>
                  <input id="name" type="text" class="form-control" maxlength="100" formControlName="totalMarks"
                  placeholder="TotalMark">
                   <span class="validation_msg"
                       *ngIf="f.totalMarks.errors && f.totalMarks.errors.required && isError">Please Enter TotalMark</span>
               </div>
                <div class="form-group col-md-6">       
                <label for="status" class="form-label">Status <span class="required">*</span></label>
                  <select name="" id="status" class="form-control" required formControlName="status" >
                    <option value="" disabled selected hidden >Select</option>
                    <option value="1">Active</option>
                    <option value="0">Inactive</option>
                  </select>
                  <span  class="validation_msg"  *ngIf="f.status.touched && f.status.invalid" >*Please Select Status</span>
                </div>
              </div>
              <!-- <div class="row">
              <div class="form-group col-md-6">
                <label class="form-label">Term Select</label>
                <select placeholder="" class="form-control"  (change)="termChange($event.target.value)" formControlName="subjectType">
                    <option value="DAT">DAT</option>
                    <option value="DST">DST</option>
                </select>
                <span class="validation_msg"
                *ngIf="f.termId.errors && f.termId.errors.required && isError">Please Enter termId</span>
            </div>
              </div> -->
            <button mat-raised-button *ngIf="!id" (click)="addDrill()">Add DRILL</button>
            <button mat-raised-button *ngIf="id" (click)="updateDrill()">Update DRILL</button>

        </form>
    </div>
</mat-card>
