<div class="mat-new">
  <h4 class="card-heading">
    <button mat-icon-button (click)="goBack()">
      <mat-icon>chevron_left</mat-icon>
    </button> Adjutant Branch<span class="sub-menu1"> > Adjutant Order > {{pTitle}} </span> <span class="sub-menu1">
    </span>
  </h4>
</div>
<mat-card>
  <div class="top-br">
    <form [formGroup]="addOrderForm">

      <div class="row">

        <div class="form-group col-md-6">
          <label for="position">Name<span class="required">*</span></label>
          <input id="name" type="text" class="form-control" maxlength="100" formControlName="name" placeholder="Name">
          <span class="validation_msg" *ngIf="f.name.errors && f.name.errors.required && isError">Please Enter
            Name</span>
        </div>
        <div class="col-md-2 form-group ">
          <label for="forGc">
            <input type="checkbox" formControlName="forGCFlag" id="forGc"> For OC
          </label>
        </div>

      </div>


      <div class="form-group">
        <label class="form-label">Document</label>

        <input type="file" accept=".doc,.docx,.pdf" #inputFile id="image" (change)="onSelectDoc($event)">
        <!-- <span  class="size_info">Max Image Size 5 MB. (Image size must be  65px * 65px)</span> -->
        <mat-icon class="document_icon" *ngIf="docUrl" (click)="openDoc()">description</mat-icon>
        <span class="note">Max File Size 200 MB. (Only pdf and doc format)</span>
        <span class="validation_msg" *ngIf="!isDoc && isError">Document is required</span>
      </div>
      <div class="row">
        <div class="form-group col-md-12">
          <label for="description">Description<span class="char-count"> ({{descLength}}/1500) </span> <span
              class="required">*</span></label>
          <!-- <input type="text" id="awards" class="form-control"  maxlength="100" formControlName="awards" placeholder="Awards"> -->
          <textarea matInput placeholder="Maximum 1500 Characters" class="form-control"
            (input)="charCount($event,'desc')" maxlength="1500" formControlName="description"></textarea>
          <span class="validation_msg" *ngIf="f.description.errors && f.description.errors.required && isError">Please Enter
            Description</span>

        </div>
      </div>
      <div class="row">
        <div class="form-group col-md-6">
          <label for="status" class="form-label">Status <span class="required">*</span></label>
          <select name="" id="status" class="form-control" required formControlName="status">
            <option value="" disabled selected hidden>Select</option>
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
          <span class="validation_msg" *ngIf="f.status.touched && f.status.invalid">*Please Select Status</span>
        </div>
      </div>
      <button mat-raised-button *ngIf="!id" (click)="addAdjutantOrder()">Add Adjutant Order</button>
      <button mat-raised-button *ngIf="id" (click)="updateOrder()">Update Adjutant Order</button>

    </form>
  </div>
</mat-card>
