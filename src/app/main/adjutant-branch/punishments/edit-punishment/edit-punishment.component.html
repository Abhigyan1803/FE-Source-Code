<div>

    <div  class="mat-dialog-title text-center" >
        <h1 >{{data.title}}</h1>
    </div>
    <form [formGroup]="editPunishmentForm" (ngSubmit)="updatePunishment()">

        <div mat-dialog-content>

            <div class="top-br mb-2">

                <div class="row">

                    <div class="form-group col-md-6">
                        <label for="position">Offence<span class="required">*</span></label>
                        <input id="" type="text" class="form-control" maxlength="100" formControlName="offence"
                            placeholder="Offence">
                        <span class="validation_msg"
                            *ngIf="f.offence.errors && f.offence.errors.required && isError">Please
                            Enter Offence</span>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="position">Date<span class="required">*</span></label>
                        <input id="date" type="date" class="form-control" formControlName="date">
                        <span class="validation_msg" *ngIf="f.date.errors && f.date.errors.required && isError">Please
                            Select Date</span>
                    </div>

                </div>

                <div class="row">

                    <div class="form-group col-md-6">
                        <label for="position">Punishment Awarded<span class="required">*</span></label>
                        <input id="" type="text" class="form-control" maxlength="100" formControlName="punshmentAwarded"
                            placeholder="Punishment Awarded">
                        <span class="validation_msg"
                            *ngIf="f.punshmentAwarded.errors && f.punshmentAwarded.errors.required && isError">Please
                            Enter Punishment Awarded</span>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="position">Total Punishments<span class="required">*</span></label>
                        <input id="points" type="text" class="form-control" maxlength="100" formControlName="points"
                            placeholder="Points">
                        <span class="validation_msg"
                            *ngIf="f.points.errors && f.points.errors.required && isError">Please
                            Enter Total Punishments</span>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="position">Awarded By<span class="required">*</span></label>
                        <input id="awardedBy" type="text" class="form-control" formControlName="awardedBy"
                            placeholder="Officer's Name">
                        <span class="validation_msg"
                            *ngIf="f.awardedBy.errors && f.awardedBy.errors.required && isError">Please Enter
                            Name</span>
                    </div>

                </div>


                <!-- <div class="row">
                <div class="form-group col-md-6">       
                <label for="status" class="form-label">Status <span class="required">*</span></label>
                  <select name="" id="status" class="form-control" required formControlName="status" >
                    <option value="" disabled selected hidden >Select</option>
                    <option value="1">Active</option>
                    <option value="0">Inactive</option>
                  </select>
                  <span  class="validation_msg"  *ngIf="f.status.touched && f.status.invalid" >*Please Select Status</span>
                </div>
              </div> -->

              

            </div>

        </div>
        <div mat-dialog-actions align="end">
            <div class="pull-right">
                <button mat-raised-button >Submit</button>
                <button mat-button mat-dialog-close >Close</button>
            </div>
        </div>

    </form>

</div>
