<div class="mat-new">
    <h4 class="card-heading">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>chevron_left</mat-icon>
        </button> Adjutant Branch <span class="sub-menu1"> > ARO > {{pTitle}} </span> <span class="sub-menu1"> 
            </span>
    </h4>
</div>
<mat-card>
    <div class="top-br">
        <form [formGroup]="addAroForm">

            <div class="row">

                <div class="form-group col-md-6">
                   <label for="position">ARO Number<span class="required">*</span></label>
                   <div class="input-group input-group-sm">
                    <div class="input-group-append" #ref *ngIf="!id">
                     <input id="name" type="text" class="form-control" maxlength="100" formControlName="name"
                       placeholder="Name">
                     <span class="input-group-text">
                       <!-- <span class="help"> -->
                        
               /{{year}}
                       <!-- </span> -->
                     </span>
                   </div>
                   <div class="input-group-append" #ref *ngIf="id">
                    <input readonly id="name" type="text" class="form-control" maxlength="100" formControlName="name"
                      placeholder="Name">
                  </div>
                  
                   <div class="input-group-append" #ref>
                     <ng-content></ng-content>
                   </div>
                 </div>
                 <span class="validation_msg"
                 *ngIf="f.name.errors && f.name.errors.required && isError">Aro number is required</span>

                </div>
             
            </div>
          

            <div class="form-group">
                <label class="form-label">Document<span class="required">*</span></label>
                
                <input type="file" accept=".doc,.docx,.pdf" #inputFile id="image" (change)="onSelectDoc($event)"> 
              
                <mat-icon class="document_icon" *ngIf="docUrl" (click)="openDoc()">description</mat-icon>            
                <span class="note">Max File Size 5 MB. (Only pdf and doc format)</span>
                <span class="validation_msg" *ngIf="!isDoc && isError" >Document is required</span>  
              </div>

              <div class="row">
                <div class="form-group col-md-6">       
                <label for="status" class="form-label">Status <span class="required">*</span></label>
                  <select name="" id="status" class="form-control" required formControlName="status" >
                    <option value="" disabled selected hidden >Select</option>
                    <option value="1">Active</option>
                    <option value="0">Inactive</option>
                  </select>
                  <span  class="validation_msg"  *ngIf="f.status.touched && f.status.invalid" >*Please Select Status</span>
                </div>
              </div>
              <div class="pull-right" >

                <button mat-raised-button *ngIf="!id" (click)="addARO()">Add ARO</button>
                <button mat-raised-button *ngIf="id" (click)="updateAro()">Update ARO</button>
    
              </div>
        </form>
    </div>
</mat-card>
