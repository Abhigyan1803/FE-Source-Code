<div class="mat-new">
  <h4 class="card-heading">
      <button mat-icon-button (click)="goBack()"><mat-icon>chevron_left</mat-icon></button> User Access
      <span class="sub-menu1"> > </span>
      <span class="sub-menu1">Manage Admin</span>
  </h4>
</div>

<mat-card>
    <div class="d-flex btn-set">
        <div class="search">
            <input class="search_input" (input)="applyFilter($event)" placeholder="Search ..." #input>
        </div>
        <button mat-raised-button (click)="openPopup()" class="add-btton btn-dark" >
            <mat-icon>add</mat-icon> Add
        </button>
    </div>

        <div class="example-container ">
        <div class="example-table-container">
            <table mat-table [dataSource]="dataSource" (matSortChange)="sortData($event)" matSort>

                <!-- Position Column -->
                <ng-container matColumnDef="number">
                    <th mat-header-cell *matHeaderCellDef>S.No.</th>
                    <td mat-cell *matCellDef="let element;let i = index;">
                        {{i +1 + (myPaginator.pageIndex * myPaginator.pageSize)}} </td>
                </ng-container>

                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Name </th>
                  <td mat-cell *matCellDef="let element"> {{element.name}} </td>
              </ng-container>

                <!-- name Column -->
                <ng-container matColumnDef="username">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> User Name </th>
                    <td mat-cell *matCellDef="let element"> {{element.username}} </td>
                </ng-container>

                 <!-- Name Column -->
            <!-- <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Password </th>
                    <td mat-cell *matCellDef="let element"> {{element.description}} </td>
                </ng-container> -->


                <!-- Status Column -->
                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef> Status </th>
                    
                    <td mat-cell *matCellDef="let element">
                        <mat-slide-toggle [checked]="element.status == 1"
                            (change)="changeManageAdminStatus($event,element)">
                        </mat-slide-toggle>
                    </td>
                </ng-container>

                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Change password </th>
                    <td mat-cell *matCellDef="let element" class="text-left justify-content-center" style="text-align:left; display:block;" >
                      <mat-icon type="button" (click)="firstPopup(element.adminId,element.username)" >create</mat-icon>
                    </td>
                </ng-container>

                <!-- Action Column -->
                <!-- <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef> Action </th>
                    <td class="act-btn" mat-cell *matCellDef="let element"> <a href="javascript:void(0)"
                            (click)="viewPOC(element)">
                            <mat-icon>visibility</mat-icon>
                        </a> </td>
                </ng-container> -->

                <tr mat-header-row *matHeaderRowDef="displayedColumns sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" style="text-align: center;" colspan="10">No Record Found</td>
                </tr>
            </table>
        </div>

        <mat-paginator #myPaginator [pageSizeOptions]="[10,20,50,100]" showFirstLastButtons></mat-paginator>
    </div>

  
</mat-card>




<div class="modal" tabindex="-1" role="dialog" [ngStyle]="{'display':displayStyle}">
    <div class="modal-dialog modal-lg  custom-lg" role="document">
      <div class="modal-content p-3">
        <div class="modal-header">
          <h5 class="modal-title">Register User Admin</h5>
        </div>
        <div class="modal-body">
            <form action="" [formGroup]="addAdminForm" autocomplete="off">
              <div class="mb-3 mt-3">
                <label for="text" class="form-label">Name:</label>
                <input type="text" class="form-control" formControlName="name" id="name" placeholder="name" name="Name">
              </div>
                <div class="mb-3">
                  <label for="text" class="form-label">User Name:</label>
                  <input type="text" class="form-control" autocomplete="off" formControlName="username" id="user" placeholder="Username" name="username">
                </div>
                <div class="mb-3">
                  <label for="pwd" class="form-label" >Password:</label>
                  <input type="password" class="form-control" autocomplete="new-password" id="pwd" formControlName="password" placeholder="Enter password" name="pswd">
                </div>
                <div class="mb-3">
                  <label for="pwd" class="form-label">Confirm Password:</label>
                  <input type="password" class="form-control" id="confpwd" formControlName="confirmpassword" placeholder="Confirm password" name="confpswd">
                </div>
                <button type="button" mat-raised-button (click)="addDetails()">Submit</button>
                <button mat-raised-button type="button" class="btn-dark" (click)="closePopup()">Close</button>
                
              </form>
        </div>
        </div>
    </div>
  </div>

  <div class="modal" tabindex="-1" role="dialog" [ngStyle]="{'display':displayStyles}">
    <div class="modal-dialog modal-lg custom-lg" role="document">
      <div class="modal-content p-3">
        <div class="modal-header">
          <h5 class="modal-title">Change Password</h5>
        </div>
        <div class="modal-body">
              <form action="" [formGroup]="changePassForm">
                
                <div class="mb-3 mt-3">
                  <label for="text" class="form-label">User Name:</label>
                  <input type="text" class="form-control" disabled formControlName="username" id="user" placeholder="Username" name="username">
                </div>
                <div class="mb-3">
                  <label for="pwd" class="form-label">New Password:</label>
                  <input type="password" class="form-control" id="pwd" formControlName="password" placeholder="Enter password" name="pswd">
                </div>
                <div class="mb-3">
                  <label for="pwd" class="form-label">Confirm Password:</label>
                  <input type="password" class="form-control" id="confpwd" formControlName="confirmpassword" placeholder="Confirm password" name="confpswd">
                </div>
                <button type="button" mat-raised-button (click)="updateManageAdmin()">Submit</button>
                <button mat-raised-button type="button" class="btn-dark" (click)="secondPopup()">Close</button>
                
              </form>
        </div>
        <div class="modal-footer">
          
  
        </div>
      </div>
    </div>
  </div>
