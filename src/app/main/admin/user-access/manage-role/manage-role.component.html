<div class="mat-new">
    <h4 class="card-heading">
        <!-- <button mat-icon-button (click)="goBack()"><mat-icon>chevron_left</mat-icon></button> User Access -->
        User Access >
        <span class="sub-menu1"> Manage Role</span>
    </h4>
</div>

<mat-card>
    <div class="d-flex btn-set">
        <div class="search">
            <input class="search_input" (input)="applyFilter($event)" placeholder="Search ..." #input>
        </div>
        <button mat-raised-button (click)="addRole()" class="add-btton">
            <mat-icon>add</mat-icon> Add
        </button>
    </div>

    <div class="example-container ">
        <div class="example-table-container">
            <table mat-table [dataSource]="dataSource" (matSortChange)="sortData($event)" matSort>
                <ng-container matColumnDef="number">
                    <th mat-header-cell *matHeaderCellDef>S.No.</th>
                    <td mat-cell *matCellDef="let element; let i = index;">
                        {{i + 1 + (myPaginator.pageIndex * myPaginator.pageSize)}}. </td>
                </ng-container>


                <!-- name Column -->
                <ng-container matColumnDef="roleName">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Role Name </th>
                    <td mat-cell *matCellDef="let element"> {{element.roleName}} </td>
                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef> Status </th>
                    <td mat-cell *matCellDef="let element">
                        <mat-slide-toggle [checked]="element.status == 1" disabled>
                        </mat-slide-toggle>
                    </td>
                </ng-container>
                
                <!-- DEPARTMENT -->
                <ng-container matColumnDef="department">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Department </th>
                    <td mat-cell *matCellDef="let element"> {{element.department || '-'}} </td>
                </ng-container>

                <!-- APPOINTMENT -->
                <ng-container matColumnDef="appt">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Appt </th>
                    <td mat-cell *matCellDef="let element"> {{element.appointment || '-'}} </td>
                </ng-container>

                <!-- Action Column -->
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef> Action </th>
                    <td class="act-btn" mat-cell *matCellDef="let element">
                        <a href="javascript:void(0)" (click)="editRow(element)">
                            <mat-icon>visibility</mat-icon>
                        </a>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" style="text-align: center;" colspan="10">No Record Found</td>
                </tr>
            </table>
        </div>

        <mat-paginator #myPaginator pageSize="50" [pageSizeOptions]="[10,20,50,100]" showFirstLastButtons></mat-paginator>
    </div>


</mat-card>
