<div class="mat-new">
    <h4 class="card-heading">
        <button mat-icon-button (click)="goBack()"><mat-icon>chevron_left</mat-icon></button> User Access 
        <span class="sub-menu1"> > Manage Role > </span>
        <span class="sub-menu1">{{pageTitle}}</span>
    </h4>
</div>

<mat-card>
    <div class="top-br">
        <form [formGroup]="addRoleForm">

            <!-- <div class="row">
                <div class="form-group col-md-6">
                    <label for="post">Department<span class="required">*</span></label>
                    <select (change)="getSubDepart($event.target.value)" formControlName="roleId" class="form-control">
                        <option value="">Select</option>
                        <option *ngFor="let d of Department" [value]="d.roleId">{{d.roleName}}</option>
                    </select>
                </div>

                <div class="form-group col-md-6">
                    <label for="post">Sub Department<span class="required">*</span></label>
                    <select (change)="getApptRole($event.target.value)" formControlName="subRoleId"
                        class="form-control">
                        <option value="" selected hidden disabled>Select</option>
                        <option *ngFor="let sub of subDepart" [value]="sub.subRoleId">{{sub.subRoleName}}</option>
                    </select>
                </div>

            </div> -->

            <div class="row">
                <div class="form-group col-md-6">
                    <label>Role name<span class="required">*</span></label>
                    <input type="text" class="form-control" formControlName="roleName" placeholder="Enter role name">
                </div>

                <div class="form-group col-md-6">
                    <label>Status<span class="required">*</span></label>
                    <select formControlName="status" class="form-control">
                        <option value="" disabled>Select status</option>
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group col-md-6">
                    <label>Department</label>
                    <!-- <input type="text"  class="form-control" formControlName="department" placeholder="Enter role name"> -->
                    <select class="form-control" formControlName="department" id="">
                        <option value="" selected>NA</option>
                        <option *ngFor="let dept of departments" [value]="dept">{{dept}} </option>
                    </select>
                </div>

                <div class="form-group col-md-6">
                    <label>Appointment</label>
                    <input type="text" class="form-control" formControlName="appointment" placeholder="Enter role name">
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <h4 class="my-3">
                        Manage Previleges
                        <div class="d-inline form-check mb-0" style="float: right; color: #003f78 !important; font-size: 13px;">
                            <input type="checkbox" class="form-check-input"
                              (change)="selectUnselectAll($event)">
                            <label class="form-check-label" style="position: relative; top: 3px;">Check/Uncheck All</label>
                          </div>
                    </h4>
                </div>

                <div class="col-md-12">
                    <table class="w-100 table table-bordered custom-table-1 mt-2">
                        <tbody>
                            <ng-container *ngFor="let module of modules; let moduleIndex = index">
                                <tr>
                                    <td colspan="2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" [checked]="module.isModule"
                                                (change)="trackInputRecord(moduleIndex, 'isModule', $event)">
                                            <label class="custom-form-check-label mb-0"> <b> {{module.moduleName}}</b></label>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="form-check pull-right">
                                            <input class="form-check-input" type="checkbox" [checked]="module.isCreate"
                                                (change)="trackInputRecord(moduleIndex, 'isCreate', $event)">
                                            <label class="custom-form-check-label mb-0"> <b> Create</b></label>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="form-check pull-right">
                                            <input class="form-check-input" type="checkbox" [checked]="module.isUpdate"
                                                (change)="trackInputRecord(moduleIndex, 'isUpdate', $event)">
                                            <label class="custom-form-check-label mb-0"> <b> Edit</b></label>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="form-check pull-right">
                                            <input class="form-check-input" type="checkbox" [checked]="module.isView"
                                                (change)="trackInputRecord(moduleIndex, 'isView', $event)">
                                            <label class="custom-form-check-label mb-0"> <b> View</b></label>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="form-check pull-right">
                                            <input class="form-check-input" type="checkbox" [checked]="module.isDelete"
                                                (change)="trackInputRecord(moduleIndex, 'isDelete', $event)">
                                            <label class="custom-form-check-label mb-0">Delete</label>
                                        </div>
                                    </td>
                                </tr>
                                <ng-container *ngIf="module.isModule">
                                    <tr *ngFor="let subModule of module.subModules; let subModuleIndex = index">
                                        <td class="w25"></td>
                                        <td>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" [checked]="subModule.isSubModule"
                                                    (change)="trackSubInputRecord(moduleIndex, subModuleIndex, 'isSubModule', $event)">
                                                <label class="custom-form-check-label mb-0">{{subModule.subModuleName}}</label>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-check pull-right">
                                                <input class="form-check-input" type="checkbox" [checked]="subModule.isCreate"
                                                    (change)="trackSubInputRecord(moduleIndex, subModuleIndex, 'isCreate', $event)">
                                                <label class="custom-form-check-label mb-0">Create</label>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-check pull-right">
                                                <input class="form-check-input" type="checkbox" [checked]="subModule.isUpdate"
                                                    (change)="trackSubInputRecord(moduleIndex, subModuleIndex, 'isUpdate', $event)">
                                                <label class="custom-form-check-label mb-0">Edit</label>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-check pull-right">
                                                <input class="form-check-input" type="checkbox" [checked]="subModule.isView"
                                                    (change)="trackSubInputRecord(moduleIndex, subModuleIndex, 'isView', $event)">
                                                <label class="custom-form-check-label mb-0">View</label>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-check pull-right">
                                                <input class="form-check-input" type="checkbox" [checked]="subModule.isDelete"
                                                    (change)="trackSubInputRecord(moduleIndex, subModuleIndex, 'isDelete', $event)">
                                                <label class="custom-form-check-label mb-0">Delete</label>
                                            </div>
                                        </td>
                                    </tr>
                                </ng-container>
                            </ng-container>
                        </tbody>
                    </table>
                </div>
            </div>

            <button class="mt-2" mat-raised-button (click)="manageRole()">{{pageTitle}}</button>
        </form>
    </div>
</mat-card>
