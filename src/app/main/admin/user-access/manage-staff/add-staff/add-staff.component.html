    <h4 class="card-heading">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>chevron_left</mat-icon>
        </button> User Access
        <span class="sub-menu1"> > Manage Staff > </span>
        <span class="sub-menu1">{{pageTitle}}</span>
    </h4>
</div>

<mat-card>
    <div class="top-br">
        <form [formGroup]="addStaffForm">
            <!-- <div class="row">

                <div class="form-group col-md-6">
                    <label for="post">Department<span class="required">*</span></label>
                    <select (change)="getSubDepart($event.target.value)" formControlName="departmentId" class="form-control">

                    </select>

                        Select
                        roleName</span>
                </div>

                <div class="form-group col-md-6">
                    <label for="post">Sub Department<span class="required">*</span></label>
                    <select (change)="getApptRole($event.target.value)" formControlName="subDepartmentId"
                        class="form-control">
                        <option value="" selected hidden (click)="$event.preventDefault()">Select</option>
                        <option *ngFor="let sub of subDepart" [value]="sub.subRoleId">{{sub.subRoleName}}</option>

                        *ngIf="f.subDepartmentId.errors && f.subDepartmentId.errors.required && isError">*Please Select
                        subRoleName</span>
                </div>

            </div> -->

            <div class="row">

                <div class="form-group col-md-6">
                    <label for="post">Officer's Name<span class="required">*</span></label>
                    <select (change)="officerSelected($event.target.value)" formControlName="userId"
                        class="form-control">
                        <option value="">Select</option>
                        <option *ngFor="let officer of officersList" [value]="officer.id">{{officer.name}}</option>
                    </select>
                    <span class="val_msg" *ngIf="f.userId.errors && f.userId.errors.required && isError">*Please Select
                        Officer</span>
                </div>

                <div class="form-group col-md-6">
                    <label for="post">Battalion</label>
                    <select (change)="battalionSelected($event.target.value)" formControlName="battalionId"
                        class="form-control">
                        <option value="0" selected>NA</option>
                        <option *ngFor="let b of battalionsList" [value]="b.id">{{b.shortName}} Bn</option>
                    </select>
                    <!-- <span class="val_msg"
                        *ngIf="f.subDepartmentId.errors && f.subDepartmentId.errors.required && isError">*Please Select
                        subRoleName</span> -->
                </div>

            </div>

            <div class="row" *ngIf="companyList.length">

                <div class="form-group col-md-6">
                    <label for="post">Company</label>
                    <select formControlName="compId" class="form-control">
                        <option value="" selected hidden (click)="$event.preventDefault()">Select</option>
                        <option *ngFor="let c of companyList" [value]="c.id">{{c.name}}</option>
                    </select>
                    <span class="val_msg" *ngIf="f.compId.errors && f.compId.errors.required && isError">*Please Select
                        Company</span>
                </div>

            </div>


            <div class="row">
                <div class="form-group col-md-6">
                    <label for="name">Username<span class="required">*</span></label>
                    <input type="text" class="form-control" maxlength="100" formControlName="username"
                        placeholder="Username">
                    <span class="val_msg" *ngIf="f.username.errors && f.username.errors.required && isError">*Please
                        Enter
                        Username</span>
                </div>

                <div class="form-group col-md-6">
                    <label class="form-label">Password
                        <span *ngIf="!id"
                            class="required">*</span></label>
                    <input type="password" class="form-control" formControlName="password">
                    <!-- <i toggle="#password-field" class="fa fa-eye field-icon"></i> -->
                    <span class="val_msg" *ngIf="f.password.errors && f.password.errors.required && isError">*Please
                        Enter Password</span>
                </div>
            </div>

            <div class="row">
                <!-- <div class="form-group col-md-6">
                    <label for="post">Role<span class="required">*</span></label>
                    <select id="post" formControlName="hasRole" class="form-control"
                        (change)="setModule($event.target.value)">
                        <option value="0">Select role</option>
                        <option *ngFor="let b of roles" [value]="b.roleId">{{b.roleName}}</option>
                    </select>
                    <span class="val_msg" *ngIf="f.hasRole.errors && f.hasRole.errors.required && isError">*Please
                        select role</span>
                </div> -->


                <div class="form-group col-md-6">
                    <label for="status">Status<span class="required">*</span></label>
                    <select id="status" formControlName="status" class="form-control">
                        <option value="" selected hidden (click)="$event.preventDefault()">Select</option>
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>
                </div>

            </div>



            <div class="row">
                <div class="form-group col-md-6">
                    <label for="">Roles</label>
                    <div *ngIf="!roles.length" class="text-center">
                        <div class="spinner-border" role="status">
                            <span class="sr-only">Loading...</span>
                        </div>
                    </div>
                    <section class="example-section" *ngFor="let dept of newRolesArr;let i=index">
                        <span class="example-list-section">
                            <h3> {{dept.department}}</h3>
                            <ul >
                                <li  *ngFor="let role of dept.roles; let j=index">
                                    <label [for]="i+''+j">
                                        <input type="checkbox" [id]="i+''+j" [checked]="roleArr.includes(role.roleId)"   (change)="roleSelected($event,role)">
                                        {{role.roleName ||'-'}}    
                                    </label>
                                </li>
                            </ul>
                        </span>
                    </section>
                </div>
            </div>

            <div class="row" *ngIf="modules.length">
                <div class="col-12">
                    <h4 class="my-3">Available Previleges</h4>
                </div>

                <div class="col-md-12">
                    <table class="w-100 table table-bordered custom-table-1 mt-2">
                        <tbody>
                            <ng-container *ngFor="let module of modules; let moduleIndex = index">
                                <tr>
                                    <td colspan="2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" [checked]="module.isModule"
                                                (click)="$event.preventDefault()">
                                            <label class="custom-form-check-label mb-0">{{module.moduleName}}</label>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="form-check pull-right">
                                            <input class="form-check-input" type="checkbox" [checked]="module.isCreate"
                                                (click)="$event.preventDefault()">
                                            <label class="custom-form-check-label mb-0">Create</label>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="form-check pull-right">
                                            <input class="form-check-input" type="checkbox" [checked]="module.isUpdate"
                                                (click)="$event.preventDefault()">
                                            <label class="custom-form-check-label mb-0">Edit</label>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="form-check pull-right">
                                            <input class="form-check-input" type="checkbox" [checked]="module.isView"
                                                (click)="$event.preventDefault()">
                                            <label class="custom-form-check-label mb-0">View</label>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="form-check pull-right">
                                            <input class="form-check-input" type="checkbox" [checked]="module.isDelete"
                                                (click)="$event.preventDefault()">
                                            <label class="custom-form-check-label mb-0">Delete</label>
                                        </div>
                                    </td>
                                </tr>
                                <ng-container *ngIf="module.isModule">
                                    <tr *ngFor="let subModule of module.subModules; let subModuleIndex = index">
                                        <td class="w25"></td>
                                        <td>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox"
                                                    [checked]="subModule.isSubModule" (click)="$event.preventDefault()">
                                                <label
                                                    class="custom-form-check-label mb-0">{{subModule.subModuleName}}</label>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-check pull-right">
                                                <input class="form-check-input" type="checkbox"
                                                    [checked]="subModule.isCreate" (click)="$event.preventDefault()">
                                                <label class="custom-form-check-label mb-0">Create</label>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-check pull-right">
                                                <input class="form-check-input" type="checkbox"
                                                    [checked]="subModule.isUpdate" (click)="$event.preventDefault()">
                                                <label class="custom-form-check-label mb-0">Edit</label>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-check pull-right">
                                                <input class="form-check-input" type="checkbox"
                                                    [checked]="subModule.isView" (click)="$event.preventDefault()">
                                                <label class="custom-form-check-label mb-0">View</label>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-check pull-right">
                                                <input class="form-check-input" type="checkbox"
                                                    [checked]="subModule.isDelete" (click)="$event.preventDefault()">
                                                <label class="custom-form-check-label mb-0">Delete</label>
                                            </div>
                                        </td>
                                    </tr>
                                </ng-container>
                            </ng-container>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="pull-right">
                <button class="mt-2" *ngIf="!id" mat-raised-button (click)="addStaff()">Add</button>
                <button class="mt-2" *ngIf="id" mat-raised-button (click)="updateStaff()">Update</button>
            </div>

        </form>
    </div>
</mat-card>
