<div class="mat-new">
    <h4 class="card-heading">Record of Service <span class="sub-menu1"></span> </h4>
</div>

<mat-card>

    <div class="d-flex btn-set">
        <div class="search">
            <input class="search_input" (input)="applyFilter($event)" placeholder="Search ..." #input>
            </div>
        <button mat-raised-button (click)="addRecordOfService()" class="add-btton">
            <mat-icon>add</mat-icon> Add
        </button>
    </div>

    <div class="example-container ">
        <div class="example-table-container">
            <table mat-table [dataSource]="dataSource" (matSortChange)="sortData($event)" matSort>

                <ng-container matColumnDef="number">
                    <th mat-header-cell *matHeaderCellDef>S.No.</th>
                    <td mat-cell *matCellDef="let c;let i = index;">
                        {{i +1 + (myPaginator.pageIndex * myPaginator.pageSize)}} </td>
                </ng-container>

                <ng-container matColumnDef="rankName">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header > Rank </th>
                    <td mat-cell *matCellDef="let o">
                        {{o.rankName}}
                    </td>
                </ng-container>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                    <td mat-cell *matCellDef="let o">
                        {{o.name}}
                    </td>
                </ng-container>

                <ng-container matColumnDef="personalNumber">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Personal Number </th>
                    <td mat-cell *matCellDef="let o">
                        {{o.personalNumber}}
                    </td>
                </ng-container>

                <ng-container matColumnDef="idCardNo">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> ID Card Number </th>
                    <td mat-cell *matCellDef="let o">
                        {{o.idCardNo}}
                    </td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef > Status </th>
                    <td mat-cell *matCellDef="let o">
                        <mat-slide-toggle [checked]="o.status == 1" (change)="changeOfficerStatus($event,o)">
                        </mat-slide-toggle>
                    </td>
                </ng-container>


                <ng-container matColumnDef="view">
                    <th mat-header-cell *matHeaderCellDef> View </th>
                    <td class="act-btn" mat-cell *matCellDef="let element"> <a href="javascript:void(0)"
                            (click)="viewRecordOfService(element)">
                            <mat-icon>visibility</mat-icon>
                        </a> </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" style="text-align: center;" colspan="10">No Record Found</td>
                </tr>
            </table>
        </div>

        <mat-paginator #myPaginator (page)="ngAfterViewInit()" [length]="100" [pageSizeOptions]="[10,20,50,100]"
            showFirstLastButtons></mat-paginator>
    </div>

</mat-card>
