
<div class="mat-new">
      
        
    <h4 class="card-heading"> 
        <button mat-icon-button (click)="goBack()" ><mat-icon>chevron_left</mat-icon> </button> Home <span class="sub-menu1">> E-Book ></span> {{pTitle}}</h4>
</div>
<mat-card>
<div class="top-br">
  <form [formGroup]="addEbookForm">     
   
    <div class="row">     
      <div class="form-group col-md-6">
        <label for="title">Name<span class="required">*</span></label>
        <input type="text" id="title" class="form-control"  maxlength="250"
        placeholder="Name" required formControlName="name">
        <!-- <span  class="validation_msg"  *ngIf="f.name.errors && f.name.errors.required " >Please Select Name</span> -->
      </div>   
      <div class="form-group col-md-6">       
        <label for="status" class="form-label">File <span class="required">*</span></label>
        <input #file type="file" accept="image/*,.pdf,.doc,.docx,.ppt,.pptx" (change)="onSelectImage($event)" id="image"> 
        <span  class="size_info">Max File Size {{sharedService.fileSize}} MB.</span>
        <div *ngIf="previewImg" class="preview_image"> <img [src]="previewImg" alt=""></div> 
      </div> 
      <div class="form-group col-md-6">
        <label for="title">Description<span class="required">*</span></label>
        <textarea type="text" id="desc" class="form-control"  
         placeholder="Description" required formControlName="description"></textarea>
        <!-- <span  class="validation_msg"  *ngIf="f.url.errors && f.url.errors.required " >Please Enter URL</span>
        <span  class="validation_msg"  >Please Enter correct URL</span> -->

      </div>    
       
    </div>
    <button mat-raised-button *ngIf="!id" (click)="addEbook()" >Add </button>
    <button mat-raised-button *ngIf="id" (click)="updateEbook()" >Update </button>

  </form>
</div>
</mat-card>
