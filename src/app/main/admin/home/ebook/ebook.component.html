<div class="mat-new">
    <h4 class="card-heading"> Home <span class="sub-menu1">> E-Book </span> </h4>

</div>

<mat-card>
   

    <div class="d-flex btn-set">
        <div class="search" style="visibility: hidden;">
            <input class="search_input" placeholder="Search ..." #input>
        </div>
        <!-- <button mat-raised-button (click)="addLink()" class="add-btton">
            <mat-icon>add</mat-icon> Add
        </button> -->
        <button mat-raised-button routerLink="/main/admin/home/ebook/add-ebook" class="add-btton">
            <mat-icon>add</mat-icon> Add
        </button>
    </div>


    <div class="example-container ">

        <div class="example-table-container">
 
            <table mat-table [dataSource]="dataSource" matSort matTableExporter 
            (matSortChange)="sortData($event)" matSort >

                      <ng-container matColumnDef="number">
                        <th mat-header-cell *matHeaderCellDef>S.No.</th>
                        <!-- <td mat-cell *matCellDef="let element;let i = index;">
                            {{i +1 + (myPaginator.pageIndex * myPaginator.pageSize)}} </td> -->
                            <td mat-cell *matCellDef="let element;let i = index;">
                                {{i +1}} </td>
                    </ng-container>
                        <ng-container matColumnDef="name">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                          <td mat-cell *matCellDef="let element">{{element.name}}</td>
                        </ng-container>
  
                        <ng-container matColumnDef="desc">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
                          <td mat-cell *matCellDef="let element">{{element.description}}</td>
                        </ng-container>
                        <ng-container matColumnDef="visit">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Visit URL</th>
                            <td mat-cell *matCellDef="let a"> 
                                <a href="javascript:void(0)" (click)="visitURL(a)" >
                                    <mat-icon>
                                        open_in_new
                                    </mat-icon>
                                </a>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="status">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Delate</th>
                            
                                <!-- <td mat-cell *matCellDef="let a">
                                    <mat-slide-toggle [checked]="a.status == 1"
                                        (change)="changeStatus($event,a)">
                                    </mat-slide-toggle>
                                </td> -->
                                <td class="act-btn" mat-cell *matCellDef="let element"> <a href="javascript:void(0)"
                                    (click)="openDialog(element)">
                                    <mat-icon>delete</mat-icon>
                                </a> </td>
                          </ng-container>
                          <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef> Action </th>
                            <td class="act-btn" mat-cell *matCellDef="let a"> <a href="javascript:void(0)"
                                    (click)="viewLink(a)">
                                    <mat-icon>visibility</mat-icon>
                                </a> </td>
                        </ng-container>
  
                        
                        <tr class="mat-row" >
                          <td class="mat-cell text-center" >
                            No data found.
                          </td>
                        </tr>
  
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                      </table>
        </div>
        
        <!-- <mat-paginator #myPaginator [pageSizeOptions]="[10,20,50,100]" showFirstLastButtons></mat-paginator> -->
    </div>


</mat-card>
