<div class="mat-new">
    <h4 class="card-heading"> Home <span class="sub-menu1">> Central Library </span> </h4>

</div>

<mat-card>
   

    <div class="d-flex btn-set">
        <div class="search">
            <input class="search_input" (input)="applyFilter($event)" placeholder="Search ..." #input>
        </div>
        <button mat-raised-button (click)="addLink()" class="add-btton">
            <mat-icon>add</mat-icon> Add
        </button>
    </div>


    <div class="example-container ">

        <div class="example-table-container">
            <table mat-table [dataSource]="dataSource" (matSortChange)="sortData($event)" matSort>
                <ng-container matColumnDef="number">
                    <th mat-header-cell *matHeaderCellDef>S.No.</th>
                    <td mat-cell *matCellDef="let element;let i = index;">
                        {{i +1 + (myPaginator.pageIndex * myPaginator.pageSize)}} </td>
                </ng-container>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Tab Name</th>
                    <td mat-cell *matCellDef="let a"> {{a.tabName}} </td>
                </ng-container>

                <ng-container matColumnDef="url">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Link URL</th>
                    <td mat-cell *matCellDef="let a"> {{a.linkUrl}} </td>
                </ng-container>

                <ng-container matColumnDef="visit">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Visit URL</th>
                    <td mat-cell *matCellDef="let a"> 
                        <a href="javascript:void(0)" (click)="visitURL(a)" >
                            <mat-icon>
                                open_in_new
                            </mat-icon>
                        </a>
                    </td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef> Status </th>
                    <td mat-cell *matCellDef="let a">
                        <mat-slide-toggle [checked]="a.status == 1"
                            (change)="changeCentralLibraryStatus($event,a)">
                        </mat-slide-toggle>
                    </td>
                </ng-container>
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef> Action </th>
                    <td class="act-btn" mat-cell *matCellDef="let a"> <a href="javascript:void(0)"
                            (click)="viewLink(a)">
                            <mat-icon>visibility</mat-icon>
                        </a> </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" style="text-align: center;" colspan="10">No Record Found</td>
                </tr>
            </table>
        </div>
        
        <mat-paginator #myPaginator [pageSizeOptions]="[10,20,50,100]" showFirstLastButtons></mat-paginator>
    </div>


</mat-card>
