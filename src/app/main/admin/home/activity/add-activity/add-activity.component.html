<div class="mat-new">
  <h4 class="card-heading">
      <button mat-icon-button (click)="goBack()">
          <mat-icon>chevron_left</mat-icon>
      </button> Home <span class="sub-menu1">> IMA Activities </span>
  </h4>
</div>
  
  <mat-card>
    <div class="top-br">
      <form  [formGroup]="addActivityForm" (ngSubmit)="addActivity()" >
        
  
        <div class="form-group">
          <label class="form-label">Image <span class="required">*</span></label>
          <span  class="size_info">Max Image Size {{sharedService.fileSize}} MB. (Image size must be  297px * 225px)</span>
          <input type="file" #file accept="image/*" id="image" (change)="onSelectImage($event)" > 
          <span *ngIf="f.image.invalid && f.image.touched" class="required" >*Please Select Image</span>
           <div *ngIf="imgUrl"  class="preview_image" style="width:200px; height:200px"> <img [src]="imgUrl" alt=""></div> 
        </div>
  
        <!-- <img *ngIf="imgUrl" [src]="imgUrl" alt="" width="100px" height="100px"> -->
  
        <div class="row">
          <div class="form-group col-md-6">
            <label for="status">Status <span class="required" >*</span> </label>
            <select name="" id="" formControlName="status" class="form-control ">
              <option value="" selected hidden disabled >Select</option>
              <option value="1">Active</option>
              <option value="0">Inactive</option>
            </select>
            <span *ngIf="f.status.invalid && f.status.touched" class="required" >*Please Select Status</span>
          </div>
        </div>
   
        <button mat-raised-button [disabled]="addActivityForm.invalid" >Add Activity</button>
  
      </form>
    </div>
  </mat-card>
