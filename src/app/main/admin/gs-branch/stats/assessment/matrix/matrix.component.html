        </div>

        <div class="example-container ">
            <div class="example-table-container">
                <table mat-table [dataSource]="dataSource" (matSortChange)="sortData($event)" matSort>
    
                    <!-- Position Column -->
                    <ng-container matColumnDef="number">
                        <th mat-header-cell *matHeaderCellDef>S.No.</th>
                        <td mat-cell *matCellDef="let element;let i = index;">
                            {{i +1 + (myPaginator.pageIndex * myPaginator.pageSize)}} </td>
                    </ng-container>
    
    
                    <!-- name Column -->
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                    </ng-container>
    
                     <!-- Name Column -->
                <ng-container matColumnDef="description">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Description </th>
                        <td mat-cell *matCellDef="let element"> {{element.description}} </td>
                    </ng-container>
    
    
                    <!-- Description Column -->
                    <ng-container matColumnDef="document">
                        <th mat-header-cell *matHeaderCellDef> Document </th>
                        <td class="act-btn" mat-cell *matCellDef="let element"> 
                            <a href="javascript:void(0)" (click)="openDoc(element)" >
                                <mat-icon>description</mat-icon>
                            </a>    
                        </td>
                    </ng-container>
    
                    <!-- Status Column -->
                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef> Status </th>
                        <td mat-cell *matCellDef="let element">
                            <mat-slide-toggle [checked]="element.status == 1"
                                (change)="changeMatrixStatus($event,element)">
                            </mat-slide-toggle>
                        </td>
                    </ng-container>
    
    
                    <!-- Action Column -->
                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef> Action </th>
                        <td class="act-btn" mat-cell *matCellDef="let element"> <a href="javascript:void(0)"
                                (click)="viewMatrix(element)">
                                <mat-icon>visibility</mat-icon>
                            </a> </td>
                    </ng-container>
    
                    <tr mat-header-row *matHeaderRowDef="displayedColumns sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" style="text-align: center;" colspan="10">No Record Found</td>
                    </tr>
                </table>
            </div>
    
            <mat-paginator #myPaginator [pageSizeOptions]="[10,20,50,100]" showFirstLastButtons></mat-paginator>
        </div>
    
      
    </mat-card>
