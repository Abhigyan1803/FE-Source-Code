
  <div class="mat-new">
    <h4 class="card-heading"> <button mat-icon-button (click)="goBack()"> <mat-icon>chevron_left</mat-icon> </button> 
      TRG Battalion <span class="sub-menu1"> > Histories </span> <span class="sub-menu1"> > {{pageTitle}}</span> </h4>
  </div>
  
  <mat-card>
    <div class="top-br">
      <form [formGroup]="addHistoryForm">
        
        <div class="row">


            <div class="form-group col-md-6">
                <label for="battalion">Battalion<span class="required">*</span></label>
                <select id="battalion" formControlName="battalion" class="form-control" >
                  <option value="" selected hidden disabled >Select</option>
                  <option *ngFor = "let b of battalionList" [value]="b.id" > {{b.shortName}} Bn </option>
                </select>
                <span class="val_msg" *ngIf="f.battalion.errors && f.battalion.errors.required && isError" >*Please Select Battalion</span>
    
              </div>
             
          <div class="form-group col-md-12">
            <label for="awards">History <span class="char-count" >   ({{descLength}}/1500)  </span> <span class="required">*</span></label>
            <!-- <input type="text" id="awards" class="form-control"  maxlength="100" formControlName="awards" placeholder="Awards"> -->
            <textarea  placeholder="Maximum 1500 Characters" class="form-control"  (input)="charCount($event)" maxlength="1500" formControlName="history"></textarea>
            <span class="val_msg" *ngIf="f.history.errors && f.history.errors.required && isError" >*Please Enter history</span>

          </div>

         
        </div>
      
        <div class="form-group">
          <label class="form-label">Image</label>
          <!-- <img *ngIf="previewImg" [src]="previewImg" width="100" height="100" alt=""> -->
          <input type="file" id="image" accept="image/*" (change)="onSelectImage($event)"> (Optional)
          <span  class="size_info">Max Image Size 5 MB. (Image size must be  65px * 65px)</span>
          <div *ngIf="previewImg" class="preview_image"> <img class="img" [src]="IP+previewImg" alt=""></div> 

        </div>
  
        <div class="row">
            <div class="form-group col-md-6">
              <label for="status">Status<span class="required">*</span></label>
              <select id="status" formControlName="status" class="form-control" >
                <option value="" selected hidden disabled >Select</option>
                <option value="1">Active</option>
                <option value="0">Inactive</option>
              </select>
              
            <span class="val_msg" *ngIf="f.status.errors && f.status.errors.required && isError" >*Please Select Status</span>

            </div>
        </div>  
        <button *ngIf="pageTitle == 'Add History'" mat-raised-button (click)="addHistory()"  >Add History</button>
        <button *ngIf="pageTitle == 'View History'" mat-raised-button (click)="updateHistory()"  >Update History</button>
  
      </form>
    </div>
  </mat-card>
