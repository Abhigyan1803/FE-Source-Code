<div class="mat-new">
    <h4 class="card-heading"> Admin OQ SUBJECT </h4>
</div>

<mat-card>
    <div class="d-flex btn-set">
        <div class="search">
            <input class="search_input" (input)="applyFilter($event)" placeholder="Search ..." #input>
        </div>
        <button mat-raised-button (click)="addPOC()" class="add-btton">
            <mat-icon>add</mat-icon> Add
        </button>
    </div>

    <div class="example-container ">
        <div class="example-table-container">
            <table mat-table [dataSource]="dataSource" (matSortChange)="sortData($event)" matSort>

                <!-- Position Column -->
                <ng-container matColumnDef="number">
                    <th mat-header-cell *matHeaderCellDef>S.No.</th>
                    <td mat-cell *matCellDef="let element;let i = index;">
                        {{i +1 + (myPaginator.pageIndex * myPaginator.pageSize)}} </td>
                </ng-container>


                <!-- name Column -->
                <ng-container matColumnDef="subjectName">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Subject Name </th>
                    <td mat-cell *matCellDef="let element"> {{element.subjectName}} </td>
                </ng-container>

                 <!-- Name Column -->
            <ng-container matColumnDef="plTotalMarks">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Pl Cdr TotalMarks </th>
                    <td mat-cell *matCellDef="let element"> {{element.totalMarksPlCdr}} </td>
                </ng-container>

                <ng-container matColumnDef="coyTotalMarks">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Coy Cdr TotalMarks </th>
                    <td mat-cell *matCellDef="let element"> {{element.totalMarksCoyCdr}} </td>
                </ng-container>

                <ng-container matColumnDef="bnTotalMarks">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Bn Cdr TotalMarks </th>
                    <td mat-cell *matCellDef="let element"> {{element.totalMarksBnCdr}} </td>
                </ng-container>


                <!-- Description Column -->
               
                <!-- Status Column -->
                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef> Status </th>
                    <td mat-cell *matCellDef="let element">
                        <mat-slide-toggle [checked]="element.status == 1"
                            (change)="changePOCStatus($event,element)">
                        </mat-slide-toggle>
                    </td>
                </ng-container>


                <!-- Action Column -->
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef> Action </th>
                    <td class="act-btn" mat-cell *matCellDef="let element"> <a href="javascript:void(0)"
                            (click)="viewPOC(element)">
                            <mat-icon>visibility</mat-icon>
                        </a> </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" style="text-align: center;" colspan="10">No Record Found</td>
                </tr>
            </table>
        </div>

        <mat-paginator #myPaginator [pageSizeOptions]="[10,20,50,100]" showFirstLastButtons></mat-paginator>
    </div>

  
</mat-card>
