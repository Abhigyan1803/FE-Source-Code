
<div class="mat-new">
    <h4 class="card-heading">
      <button mat-icon-button (click)="goBack()" ><mat-icon>chevron_left</mat-icon> </button>
      OQ SUBJECT <span class="sub-menu1"></span>
    </h4>
  </div>
  <mat-card>
    <div class="top-br">
      <form [formGroup]="addSUBJECTForm">
  
        <div class="row">

            <div class="form-group col-md-6">
               <label for="position">Subject Name<span class="required">*</span></label>
               <input id="name" type="text" class="form-control" maxlength="100" formControlName="subjectName"
               placeholder="Name">
                <span class="validation_msg"
                    *ngIf="f.subjectName.errors && f.subjectName.errors.required && isError">Please Enter Name</span>
            </div>

            <div class="form-group col-md-6">
                <label for="position">Pl CDR TotalMarks<span class="required">*</span></label>
                <input id="name" type="text" class="form-control" maxlength="100" formControlName="totalMarksPlCdr"
                placeholder="Pl TotalMarks">
                 <span class="validation_msg"
                     *ngIf="f.totalMarksPlCdr.errors && f.totalMarksPlCdr.errors.required && isError">Please Enter Pl TotalMarks</span>
             </div>
             
            <div class="form-group col-md-6">
                <label for="position">Coy CDR TotalMarks<span class="required">*</span></label>
                <input id="name" type="text" class="form-control" maxlength="100" formControlName="totalMarksCoyCdr"
                placeholder="Coy TotalMarks">
                 <span class="validation_msg"
                     *ngIf="f.totalMarksCoyCdr.errors && f.totalMarksCoyCdr.errors.required && isError">Please Enter Coy TotalMarks</span>
             </div>

             <div class="form-group col-md-6">
                <label for="position">Bn CDR TotalMarks<span class="required">*</span></label>
                <input id="name" type="text" class="form-control" maxlength="100" formControlName="totalMarksBnCdr"
                placeholder="Bn TotalMarks">
                 <span class="validation_msg"
                     *ngIf="f.totalMarksBnCdr.errors && f.totalMarksBnCdr.errors.required && isError">Please Enter Bn TotalMarks</span>
             </div>


        </div> 

       

        
  
        <div class="row">
          <div class="form-group col-md-6">
            <label for="status">Status<span class="required" >*</span></label>
            <select name="" id="" class="form-control " formControlName="status">
              <option value="" disabled selected hidden>Status</option>
              <option value="1">Active</option>
              <option value="0">Inactive</option>
            </select>
            <span class="validation_msg" *ngIf="f.status.errors && f.status.errors.required && isError" >Status is required</span> 
          </div>
        </div>
  
        <button mat-raised-button *ngIf="pageTitle=='Add SUBJECT'" (click)="addSUBJECT()">ADD SUBJECT</button>
        <button mat-raised-button *ngIf="pageTitle=='View SUBJECT'" (click)="updateSUBJECT()">Update SUBJECT</button>
  
      </form>
    </div>
  </mat-card>
