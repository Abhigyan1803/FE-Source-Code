<div class="mat-new">
  <h4 class="card-heading"> 
    <button mat-icon-button (click)="goBack()" ><mat-icon>chevron_left</mat-icon> </button>
    TRG Battalion <span class="sub-menu1"> > BRO </span> <span class="sub-menu1">> {{title}}  </span>
  </h4>
</div>
<mat-card>
  <div class="top-br">
    <form [formGroup]="addBroForm">

      <div class="row">
      <div class="form-group col-md-6">
        <label class="form-label"> BRO Number <span class="required">*</span></label>
        <div class="input-group input-group-sm">
           <div class="input-group-append" #ref *ngIf="!id" >
            <input id="name" type="text" class="form-control" maxlength="100" formControlName="number"
              placeholder="BRO Number">
            <span class="input-group-text">
              <!-- <span class="help"> -->
               
      {{year}}
              <!-- </span> -->
            </span>
            <span class="validation_msg" *ngIf="f.number.errors && f.number.errors.required && isError" >Number is required</span>
          </div>
          <div class="input-group-append" #ref *ngIf="id" >
            <input readonly id="name" type="text" class="form-control" maxlength="100" formControlName="number"
              placeholder="ARO Number">
            
          </div>

          <div class="input-group-append" #ref>
            <ng-content></ng-content>
          </div>
        </div>
      </div>
      </div>

      <div class="row">
      <div class="form-group col-md-6">
        <label class="form-label"> Date <span class="required">*</span></label>
        <input type="date"  [min]="minDate"  class="form-control" formControlName="date">
        <span class="validation_msg" *ngIf="f.date.errors && f.date.errors.required && isError" >Date is required</span> 
      </div>
      <div *ngIf="isAdmin" class="form-group col-md-6">
        <label class="form-label"> Battalion <span class="required">*</span></label>
        <select type="date"   class="form-control" formControlName="battalion">
          <option value="" selected hidden disabled>Select</option>
          <option *ngFor="let b of battalionsList"  [value]="b.id" > {{b.shortName}} Bn </option>
        </select>
        <span class="validation_msg" *ngIf="f.date.errors && f.date.errors.required && isError" >Date is required</span> 
      </div>
    </div>

      <!-- <div class="form-group">
        <label class="form-label"> Document <span class="required">*</span></label>
        <input type="file" #inputFile accept=".pdf,.doc,.docx" (change)="onSelectDoc($event)" id="image">
        <mat-icon *ngIf="docUrl" class="document_icon" (click)="openDoc(docUrl)" >description</mat-icon>
        <span class="note">Max File Size 5 MB. (Only pdf and doc format.)</span>
        <span class="validation_msg" *ngIf="!isDoc" >Document is required</span>
        
      </div> -->

      
 
    <div class="form-group">
        <label class="form-label">Document<span class="required">*</span></label>
        <input type="file" #inputFile accept=".pdf,.doc,.docx" (change)="onSelectDoc($event)" id="image">
        <mat-icon *ngIf="docUrl" class="document_icon" (click)="openDoc(docUrl)">description</mat-icon>
        <span class="note">Max File Size 50 MB. (Only pdf and doc format.)</span>
        <span class="validation_msg" *ngIf="!isDoc && isError">Document is required</span>
    </div>


      <div class="row">
        <div class="form-group col-md-6">
          <label class="form-label"> Status <span class="required">*</span></label>
          <select class="form-control" formControlName="status">
            <option value="" selected hidden disabled>Select</option>
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
          <span class="validation_msg" *ngIf="f.status.errors && f.status.errors.required && isError" >Status is required</span> 
        </div>
      </div>

      <button *ngIf="!id" mat-raised-button (click)="submit()">Add BRO</button>
      <button *ngIf="id" mat-raised-button (click)="updateBro()">Update BRO</button>

    </form>
  </div>
</mat-card>
