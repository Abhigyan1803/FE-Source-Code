<div class="mat-new">
  <h4 class="card-heading">
    <button mat-icon-button (click)="goBack()" ><mat-icon>chevron_left</mat-icon> </button>
    TRG Battalion <span class="sub-menu1"> > Assignment of Duties > {{title}}</span>
  </h4>
</div>
<mat-card>
  <div class="top-br">
    <form [formGroup]="addAssignmentForm">

      <div class="row" *ngIf="isAdmin" >
        <div class="form-group col-md-6">
          <label class="form-label">Battalion<span class="required">*</span></label>
          <select name="" id="" class="form-control" formControlName="battalionType">
            <option value="" disabled selected hidden>Select Battalion</option>
            <option *ngFor="let battlion of battalionList" [value]="battlion.id">{{battlion.shortName}} Bn</option>
          </select>
          <span class="validation_msg" *ngIf="f.battalionType.errors && f.battalionType.errors.required && isError" >Battalion is required</span> 
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Document<span class="required">*</span></label>
          <input type="file" #inputFile accept=".pdf,.doc,.docx" (change)="onSelectDoc($event)" id="image">
          <mat-icon *ngIf="docUrl" class="document_icon" (click)="openDoc(docUrl)" >description</mat-icon>
          <span class="note">Max File Size 50 MB. (Only pdf and doc format.)</span>
          <span class="validation_msg" *ngIf="!isDoc" >Document is required</span>
      </div>

      <div class="row">
        <div class="form-group col-md-6">
          <label for="status">Status<span class="required" >*</span></label>
          <select name="" id="" class="form-control " formControlName="status">
            <option value="" disabled selected hidden>Status</option>
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
          <span class="validation_msg" *ngIf="f.status.errors && f.status.errors.required && isError" >Status is required</span> 
        </div>
      </div>

      <button mat-raised-button *ngIf="title=='Add Assignment of Duties'" (click)="submit()">Add Assignment</button>
      <button mat-raised-button *ngIf="title=='View Assignment of Duties'" (click)="updateAssignment()">Update Assignment</button>

    </form>
  </div>
</mat-card>
