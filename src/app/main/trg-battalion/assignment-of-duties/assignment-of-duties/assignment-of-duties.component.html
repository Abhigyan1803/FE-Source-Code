<div class="mat-new">
    <h4 class="card-heading">TRG Battalion<span class="sub-menu1"> >  Assignment of Duties</span> </h4>

</div>

<mat-card>
    <div class="d-flex btn-set">
        <div class="search">
            <input class="search_input" (input)="applyFilter($event)" placeholder="Search ..." #input>
        </div>
        <button mat-raised-button (click)="addAssignment()" class="add-btton">
            <mat-icon>add</mat-icon> Add
        </button>
    </div>
     
    <div class="example-container ">  
        <div class="example-table-container">
    <table mat-table [dataSource]="dataSource" (matSortChange)="sortData($event)" matSort>

        <!-- Position Column -->
        <ng-container matColumnDef="number">
            <th mat-header-cell *matHeaderCellDef>S.No.</th>
            <td mat-cell *matCellDef="let element;let i = index;">
                {{i +1 + (myPaginator.pageIndex * myPaginator.pageSize)}} </td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
            <td mat-cell *matCellDef="let element"> {{element.date|date:'d MMMM, y'}} </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef > Status </th>
            <td mat-cell *matCellDef="let element">
                <mat-slide-toggle [checked]="element.status == 1" (change)="changeStatus($event,element)">
                </mat-slide-toggle>
            </td>
        </ng-container>
        <!-- Document Column -->
        <ng-container matColumnDef="document">
            <th mat-header-cell *matHeaderCellDef > Document </th>
            <td class="act-btn" mat-cell *matCellDef="let element">
                <a class="act-btn" href="javascript:void(0)" (click)="openDoc(element.document)"><mat-icon>description</mat-icon> </a>
            </td>
        </ng-container>

        <!-- Battalion Column -->
        <ng-container matColumnDef="battalion">
            <th mat-header-cell *matHeaderCellDef > Battalion </th>
            <td class="act-btn" mat-cell *matCellDef="let element">
               {{element.battalion}}
            </td>
        </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef > Action </th>
            <td class="act-btn" mat-cell *matCellDef="let element"> <a  href="javascript:void(0)" (click)="viewAssignment(element.id)">
                    <mat-icon >visibility</mat-icon>
                </a> </td>
        </ng-container>

        <ng-container matColumnDef="delete">
            <th mat-header-cell *matHeaderCellDef > Delete </th>
            <td class="act-btn" mat-cell *matCellDef="let element"> <a  href="javascript:void(0)" (click)="delete(element)">
                    <mat-icon >delete</mat-icon>
                </a> </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns sticky:true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" style="text-align: center;" colspan="10">No Record Found</td>
        </tr>
    </table>

</div>
    <mat-paginator #myPaginator [pageSizeOptions]="[10,20,50,100]" showFirstLastButtons></mat-paginator>
</div>
</mat-card>
