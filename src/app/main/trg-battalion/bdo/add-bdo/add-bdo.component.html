<div class="mat-new">
  <h4 class="card-heading">
    <button mat-icon-button (click)="goBack()">
      <mat-icon>chevron_left</mat-icon>
    </button>
    TRG Battalion <span class="sub-menu1">> BDO > {{title}} </span> <span class="sub-menu1"> </span>
  </h4>
</div>
<mat-card>
  <div class="top-br">
    <form [formGroup]="addBdoForm">
      <div class="row">
        <div class="form-group col-md-6">
          <label class="form-label"> Date <span class="required">*</span></label>
          <input type="date" [min]="minDate" class="form-control" formControlName="date">
          <span class="validation_msg" *ngIf="f.date.errors && f.date.errors.required && isError">Date is
            Required</span>
        </div>
        <div *ngIf="isAdmin" class="form-group col-md-6">
          <label class="form-label"> Battalion <span class="required">*</span></label>
          <select type="date" class="form-control" formControlName="battalion">
            <option value="" selected hidden disabled>Select</option>
            <option *ngFor="let b of battalionsList" [value]="b.id"> {{b.shortName}} Bn </option>
          </select>
          <span class="validation_msg" *ngIf="f.battalion.errors && f.battalion.errors.required && isError">Please
            Select Battalion</span>
        </div>
      </div>

      <!-- <div class="form-group">
        <label class="form-label"> Document <span class="required">*</span></label>
        <input type="file" #inputFile accept=".pdf,.doc,.docx" (change)="onSelectDoc($event)" id="image">
        <mat-icon *ngIf="docUrl" class="document_icon" (click)="openDoc(docUrl)">description</mat-icon>
        <span class="note">Max File Size 5 MB. (Only pdf and doc format.)</span>
        <span class="validation_msg" *ngIf="!isDoc && isError">Document is required</span>
      </div> -->

      <div class="form-group">
        <label class="form-label">Document<span class="required">*</span></label>
        <input type="file" #inputFile accept=".pdf,.doc,.docx" (change)="onSelectDoc($event)" id="image">
        <mat-icon *ngIf="docUrl" class="document_icon" (click)="openDoc(docUrl)">description</mat-icon>
        <span class="note">Max File Size 50 MB. (Only pdf and doc format.)</span>
        <span class="validation_msg" *ngIf="!isDoc && isError">Document is required</span>
      </div>

      <div class="row">
        <div class="form-group col-md-6">
          <label class="form-label"> Status <span class="required">*</span></label>
          <select class="form-control" formControlName="status">
            <option value="" selected hidden disabled>Select</option>
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
          <span class="validation_msg" *ngIf="f.status.errors && f.status.errors.required && isError">Status is required</span>
        </div>
      </div>

      <button *ngIf="!id" mat-raised-button (click)="submit()">Add Bdo</button>
      <button *ngIf="id" mat-raised-button (click)="updateBdo()">Update Bdo</button>

    </form>
  </div>
</mat-card>
