<div class="mat-new">
    <h4 class="card-heading">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>chevron_left</mat-icon>
        </button>  
        Examination ><span class="sub-menu1"> Distribution of Marks > {{type}} > Add Distribution of Marks </span>

        <span class="sub-menu1"> </span>
    </h4>
</div>
<mat-card>
    <div class="top-br">
        <form [formGroup]="addDistributionform">
            <div class="row">
                <div class="form-group col-md-6">
                    <label class="form-label">Name </label>
                    <input type="text" formControlName="name" maxlength="100" placeholder=" Name" class="form-control">
                    <span class="validation_msg" *ngIf="f.name.errors && f.name.errors.required && isError">Name is
                        required</span>
                </div>

                <!-- <div class="form-group col-md-6">
                    <label class="form-label">Term </label>
                    <select placeholder="" class="form-control" formControlName="termId">
                        <option disabled selected hidden></option>
                        <option *ngFor="let t of terms" [value]="t.id">{{t.name}} </option>
                    </select>
                    <span class="validation_msg" *ngIf="f.termId.errors && f.termId.errors.required && isError">Please
                        Enter termId</span>
                </div> -->

            </div>

            <div class="row">
                <div class="form-group col-md-12">
                    <label class="form-label">Document<span class="required">*</span></label>
                    <input type="file" #inputFile accept=".pdf,.doc,.docx" (change)="onSelectDoc($event)" id="image">
                    <mat-icon  class="document_icon" (click)="openDoc(url)"> description</mat-icon>
                    <span class="note">Max File Size 200 MB. (Only pdf and doc format.)</span>
                    <span class="validation_msg" *ngIf="!isDoc && isError">Document is required</span>
                </div>
            </div>

            <div class="form-group col-md-6">
                <label for="position" hidden>Type<span class="required">*</span></label>
                <input id="name" type="text" hidden class="form-control" maxlength="100" formControlName="type"
                    placeholder="Name">
                <!-- <span class="validation_msg"
                     *ngIf="f.type.errors && f.type.errors.required && isError">Please Enter type</span> -->
            </div>

            <div class="row">
                <div class="form-group col-md-6">
                    <label class="form-label">Status <span class="required">*</span></label>
                    <select class="form-control" formControlName="status">
                        <option value="" selected hidden disabled>Status</option>
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>
                    <span class="validation_msg" *ngIf="f.status.errors && f.status.errors.required && isError">Status
                        is required</span>
                </div>
            </div>


            <div class="pull-right" >

                <button *ngIf="!id" mat-raised-button (click)="submit()">Add </button>
                <button *ngIf="id" mat-raised-button (click)="update()">Update </button>
    
            </div>

        </form>
    </div>
</mat-card>
