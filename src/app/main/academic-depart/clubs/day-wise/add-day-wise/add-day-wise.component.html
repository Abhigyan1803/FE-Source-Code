
<div class="mat-new">
  <h4 class="card-heading">
    <button mat-icon-button (click)="goBack()" ><mat-icon>chevron_left</mat-icon> </button>
    Day Wise <span class="sub-menu1">  <span class="sub-menu1"> > {{pageTitle}}</span></span>
  </h4>
</div>
  <mat-card>
    <div class="top-br">
      <form [formGroup]="addPCHTForm">
  
        <div class="row">

            <div class="form-group col-md-6">
               <label for="clubname">Name<span class="required">*</span></label>
               <!-- <input id="name" type="text" class="form-control" maxlength="100" formControlName="name"
               placeholder="Name"> -->
                <select name="" id="clubname" formControlName="name" class="form-control">
                  <option value="" selected hidden disabled >--</option>
                  <option *ngFor="let n of clubsNames;let i=index"  [value]="n"> {{n}} </option>
                </select>
                <span class="validation_msg"
                    *ngIf="f.name.errors && f.name.errors.required && isError">Please Enter Name</span>
            </div>


        </div> 
        
       
        <div class="form-group">
          <label class="form-label">Document<span class="required">*</span></label>
            <input type="file" #inputFile accept=".pdf,.doc,.docx" (change)="onSelectDoc($event)" id="image">
            <mat-icon *ngIf="docUrl" class="document_icon" (click)="openDoc(docUrl)" >description</mat-icon>
            <span class="note">Max File Size 200 MB. (Only pdf and doc format.)</span>
            <span class="validation_msg" *ngIf="!isDoc && isError" >Document is required</span>  
        </div>
        <div class="row">

        <div class="form-group col-md-6">
            <label for="position" hidden>Type<span class="required">*</span></label>
            <input id="name" type="text" hidden class="form-control" maxlength="100" formControlName="type"
            placeholder="Name">
             <span class="validation_msg"
                 *ngIf="f.type.errors && f.type.errors.required && isError">Please Enter type</span>
         </div>

</div>
      
  
        <div class="row">
          <div class="form-group col-md-6">
            <label for="status">Status<span class="required" >*</span></label>
            <select name="" id="" class="form-control " formControlName="status">
              <option value="" disabled selected hidden>Status</option>
              <option value="1">Active</option>
              <option value="0">Inactive</option>
            </select>
            <span class="validation_msg" *ngIf="f.status.errors && f.status.errors.required && isError" >Status is required</span> 
          </div>
        </div>
  
        <button mat-raised-button *ngIf="pageTitle=='Add Daywise'" (click)="addAchievements()">ADD Daywise</button>
        <button mat-raised-button *ngIf="pageTitle=='View Daywise'" (click)="updateDaywise()">Update Daywise</button>
  
      </form>
    </div>
  </mat-card>
