<div class="mat-new">
    <h4 class="card-heading"> Subjects<span class="sub-menu1"> > {{paper}} > {{sTitle}} > {{term}} </span> </h4>

</div>

<mat-card>
    <!-- <mat-card-title>
        <div class="text-right" >
            <button mat-raised-button (click)="addSubject()" class="add-btton">
                <mat-icon>add</mat-icon> Add
            </button>
        </div>
    </mat-card-title> -->
    <mat-card-actions>
        <div class="text-right mr-3 " >
            <button mat-raised-button (click)="addSubject()" class="add-btton">
                <mat-icon>add</mat-icon> Add
            </button>
        </div>
    </mat-card-actions>
    <mat-card-content>
        <div class="card m-4" *ngFor="let topics of subjectList; let i=index">
                <div class="card-body row">

                    <div class="p-2 col-md-4" >

                        <mat-list role="list">
                            <mat-list-item role="listitem" >
                                <h4>Date</h4>
                            </mat-list-item>

                            <mat-list-item role="listitem" >
                                {{topics.createdAt | date:'dd MMM yyyy'}}
                            </mat-list-item>
                        </mat-list>
                    </div>
                    <div class="p-2 col-md-4 topics-data" >
                        <mat-list role="list">
                            <mat-list-item role="listitem">
                               <h4>Topics</h4> 
                            </mat-list-item>
                            <mat-list-item role="listitem" *ngFor="let t of topics.termTopic">{{t.topicName}}</mat-list-item>
                        </mat-list>
                    </div>
        
                    <div class="p-2 col-md-2" >
                            <mat-list role="list">
                                <mat-list-item role="listitem">
                                   <h4>View</h4> 
                                </mat-list-item>
                                <mat-list-item role="listitem" >
                                        <a href="javascript:void(0)" class="act-btn" (click)="viewSubject(topics)">
                                            <mat-icon>
                                                visibility
                                            </mat-icon>
                                        </a>
                                </mat-list-item>
                            </mat-list>
                    </div>
                    <div class="p-2 col-md-2" >
                        <mat-list role="list">
                            <mat-list-item role="listitem">
                               <h4>Delete</h4> 
                            </mat-list-item>
                            <mat-list-item role="listitem" >
                                    <a href="javascript:void(0)" class="act-btn" (click)="deleteSubject(topics)">
                                        <mat-icon>
                                            delete
                                        </mat-icon>
                                    </a>
                            </mat-list-item>
                        </mat-list>
                </div>
                
                    
                </div>
        </div>
        
        
    </mat-card-content>
</mat-card>
