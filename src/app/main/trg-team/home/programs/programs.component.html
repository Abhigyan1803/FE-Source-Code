  <div class="example-container ">
        <div class="example-table-container">
            <table mat-table [dataSource]="dataSource" (matSortChange)="sortData($event)" matSort>

                <!-- Position Column -->
                <ng-container matColumnDef="number">
                    <th mat-header-cell *matHeaderCellDef>S.No.</th>
                    <td mat-cell *matCellDef="let element;let i = index;">
                        {{i +1 + (myPaginator.pageIndex * myPaginator.pageSize)}} </td>
                </ng-container>


                <!-- Date Column -->
                <ng-container matColumnDef="date">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
                    <td mat-cell *matCellDef="let element"> {{element.scheduledDate|date:'d MMM, y'}} </td>
                </ng-container>

               <ng-container matColumnDef="time">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Time </th>
                  <td mat-cell *matCellDef="let element"> {{element.startTime|date:'HHmm'}}-{{element.endTime|date:'HHmm'}} </td>
               </ng-container>

                <!-- Programme Column -->
                <ng-container matColumnDef="programme">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Programme </th>
                    <td mat-cell *matCellDef="let element"> {{element.title}} </td>
                </ng-container>

                <!-- Venue Column -->
                <ng-container matColumnDef="venue">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Venue </th>
                    <td mat-cell *matCellDef="let element"> {{element.venue}} </td>
                </ng-container>

                <!-- Action Column -->
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef> Action </th>
                    <td class="act-btn" mat-cell *matCellDef="let element"> <a href="javascript:void(0)"
                            (click)="viewProgram(element)">
                            <mat-icon>visibility</mat-icon>
                        </a> </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" style="text-align: center;" colspan="10">No Record Found</td>
                </tr>
            </table>
        </div>
        <mat-paginator #myPaginator [pageSizeOptions]="[10,20,50,100]" showFirstLastButtons></mat-paginator>
    </div>
   

</mat-card>
