<div class="mat-new">
  <h4 class="card-heading">
    <button mat-icon-button (click)="goBack()">
      <mat-icon>chevron_left</mat-icon>
    </button>
    Home <span class="sub-menu1"> > Announcements <span class="sub-menu1"> > {{pageTitle}}</span></span>
  </h4>
</div>
<mat-card>
  <div class="top-br">
    <form [formGroup]="addAnnouncementForm">


      <div class="row">
        <div class="form-group col-md-12">
          <label for="awards">Announcement Description <span class="char-count"> ({{descLength}}/1500) </span> <span
              class="required">*</span></label>
          <!-- <input type="text" id="awards" class="form-control"  maxlength="100" formControlName="awards" placeholder="Awards"> -->
          <textarea matInput placeholder="Maximum 1500 Characters" class="form-control" (input)="charCount($event)"
            maxlength="1500" formControlName="announcementDescp"></textarea>
          <span class="val_msg"
            *ngIf="f.announcementDescp.errors && f.announcementDescp.errors.required && isError">*Please Enter
            announcementDescp</span>

        </div>
      </div>

      <div class="row">
        <div class="form-group col-md-6">
          <label for="date">Valid Till<span class="required">*</span></label>
          <input id="date" #scheduleDate type="date" [min]="minDate" class="form-control" (change)="dateChanged($event)"
            formControlName="validTill">
          <!-- <span  class="validation_msg"  *ngIf="f.validTill.touched && f.validTill.invalid" >Please Select validTill</span> -->
          <span class="validation_msg" *ngIf="f.validTill.errors && f.validTill.errors.required && isError">This
            Field is Required</span>
        </div>
      </div>


      <div class="form-group">
        <label class="form-label">Document (Optional)</label>
        <input type="file" #inputFile accept=".pdf,.doc,.docx,png,jpeg,jpg" (change)="onSelectDoc($event)" id="image">
        <mat-icon *ngIf="docUrl" class="document_icon" (click)="openDoc(docUrl)">description</mat-icon>
        <span class="note">Max File Size 150 MB. </span>
        <span class="validation_msg" *ngIf="!isDoc">Document is required</span>
      </div>

      <div class="row">
        <div class="form-group col-md-6">
          <label for="status">Status<span class="required">*</span></label>
          <select name="" id="" class="form-control " formControlName="status">
            <option value="" disabled selected hidden>Status</option>
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
          <span class="validation_msg" *ngIf="f.status.errors && f.status.errors.required && isError">Status is
            required</span>
        </div>
      </div>

      <div class="pull-right" >

        <button mat-raised-button *ngIf="!id" (click)="addAnnouncement()">Add</button>
        <button mat-raised-button *ngIf="id" (click)="updateAnnouncement()">Update</button>
  
      </div>

    </form>
  </div>
</mat-card>
