<div class="m-4 p-2">

    <h2 mat-dialog-title>{{data.title}}</h2>
    <mat-dialog-content class="mat-typography">

        <div class="answer-content" > 

            <div class="q-a">
                <h4> <strong>Question: </strong> </h4>
                <p [innerHTML]="data.assignmentData.question"></p>
            </div>
            <div class="q-a">
                <h4> <strong>Answer:</strong> </h4>
                <p [innerHTML]="data.assignmentData.answer"></p>
            </div>
    
        </div>

    </mat-dialog-content>

    <!-- <div class="end-btns"> -->
        <mat-dialog-actions  class="act-btns pull-right"  >
            <button mat-button mat-dialog-close>Cancel</button>
            <button mat-raised-button [mat-dialog-close]="true" cdkFocusInitial>Confirm</button>
        </mat-dialog-actions>
    <!-- </div> -->



</div>
