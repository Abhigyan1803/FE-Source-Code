<div class="maincontent">
    <div class="container-fluid mt-20">



        <div class="mt-20 show-data ">
           
               
                    <div class="mat-new">
                        <h4 class="card-heading"> Entitlements <span class="sub-menu1"> > {{type}}</span> </h4>
                    
                    </div>
                <div class="row btn-set" >
                    <div class="search">
                        <input class="search_input" (input)="applyFilter($event)" placeholder="Search ..." #input>
                    </div>
                  
                    <button mat-raised-button (click)="addEntitlement()" class="add-btton">
                        <mat-icon>add</mat-icon> Add
                    </button>
                </div>
            
                <div class="example-container ">
                    <div class="example-table-container">
                        <table mat-table [dataSource]="dataSource" (matSortChange)="sortData($event)" matSort>
            
                            <ng-container matColumnDef="number">
                                <th mat-header-cell *matHeaderCellDef>S.No.</th>
                                <td mat-cell *matCellDef="let element;let i = index;">
                                    {{i +1 + (myPaginator.pageIndex * myPaginator.pageSize)}} </td>
                            </ng-container>
            
                            <ng-container matColumnDef="title">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header> Title </th>
                                <td mat-cell *matCellDef="let element"> {{element.title}} </td>
                            </ng-container>
            
                            
                            <ng-container matColumnDef="address" >
                                <th mat-header-cell *matHeaderCellDef  mat-sort-header>Address </th>
                                <td mat-cell *matCellDef="let element">{{element.address}}</td>
                            </ng-container>
            
                            <ng-container matColumnDef="details">
                                <th mat-header-cell *matHeaderCellDef  mat-sort-header>Details</th>
                                <td mat-cell *matCellDef="let element"> {{element?.details}} </td>
                            </ng-container>
            
                            
                            
            
                            
                            <!-- <ng-container matColumnDef="status">
                                <th mat-header-cell *matHeaderCellDef> Status </th>
                                <td mat-cell *matCellDef="let element">
                                    <mat-slide-toggle [checked]="element.status == 1"
                                        (change)="changeGreybookStatus($event,element.id)">
                                    </mat-slide-toggle>
                                </td>
                            </ng-container> -->
            
            
                            
                            <!-- <ng-container matColumnDef="action">
                                <th mat-header-cell *matHeaderCellDef> Action </th>
                                <td class="act-btn" mat-cell *matCellDef="let element"> <a href="javascript:void(0)"
                                        (click)="viewGreybook(element)">
                                        <mat-icon>visibility</mat-icon>
                                    </a> </td>
                            </ng-container> -->
            
                            <tr mat-header-row *matHeaderRowDef="displayedColumns sticky: true"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                            <tr class="mat-row" *matNoDataRow>
                                <td class="mat-cell" style="text-align: center;" colspan="10">No Record Found</td>
                            </tr>
                        </table>
                    </div>
            
                    <mat-paginator #myPaginator [pageSizeOptions]="[10,20,50,100]" showFirstLastButtons></mat-paginator>
                </div>
            
            
            
            </div>







    </div>
</div>
